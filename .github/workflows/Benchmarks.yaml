name: Benchmark Tracking
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Benchmarks.yaml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'benchmark/**'
      - 'Project.toml'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Benchmarks.yaml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'benchmark/**'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
    actions: write
    contents: write
    deployments: write
    pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run benchmarks
        run: |
          cd benchmark
          julia --project --threads=1 --gcthreads=1 --color=yes -e '
            using Pkg;
            Pkg.develop(PackageSpec(path=joinpath(pwd(), "..")));
            Pkg.instantiate();
            include("runbenchmarks.jl")'

      - name: Check out the PR base
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
          persist-credentials: false

      - name: Compare against the base on this runner
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cd benchmark
          mv benchmarks_output.json benchmarks_head.json
          julia --project --threads=1 --gcthreads=1 --color=yes -e '
            using Pkg;
            Pkg.develop(PackageSpec(path=joinpath(pwd(), "..", "benchmark-base")); preserve=Pkg.PRESERVE_ALL);
            Pkg.instantiate();
            include("../benchmark-base/benchmark/runbenchmarks.jl")'
          mv benchmarks_output.json benchmarks_base.json
          julia --project --color=yes comparebenchmarks.jl benchmarks_base.json benchmarks_head.json

      - name: Save comparison measurements
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comparison
          path: |
            benchmark/benchmarks_base.json
            benchmark/benchmarks_head.json

      # this will update benchmark/data.js in gh-pages branch
      - name: Parse & Upload Benchmark Results
        if: ${{ github.event_name != 'pull_request' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmark Results
          tool: "julia"
          output-file-path: benchmark/benchmarks_output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "130%"
          fail-threshold: "170%"
          comment-on-alert: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          comment-always: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-alert: true
          benchmark-data-dir-path: benchmark
          max-items-in-chart: 100
          auto-push: ${{ github.event_name != 'pull_request' }}
